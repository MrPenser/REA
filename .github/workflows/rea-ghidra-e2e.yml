name: REA real Ghidra native analysis E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rea-ghidra-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-ghidra-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ghidra-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      HUSKY: "0"
      NO_COLOR: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      GHIDRA_RELEASE_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      GHIDRA_RELEASE_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout REA exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify compiler, JDK and repository state
        run: |
          set -euo pipefail
          mkdir -p verification-results
          git rev-parse HEAD | tee verification-results/commit.txt
          command -v cc
          cc --version | head -n 1
          if [[ -n "${JAVA_HOME_21_X64:-}" ]]; then
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            "$JAVA_HOME_21_X64/bin/java" -version
          else
            echo "::error::Runner missing JDK 21; environment prerequisite not satisfied"
            exit 1
          fi

      - name: Install pinned REA dependencies and compile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:cached

      - name: Fetch official Ghidra 12.1.4 and verify vendor SHA-256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-ghidra-dist"
          curl --fail --location --retry 3 --retry-delay 3 \
            --output "$RUNNER_TEMP/ghidra.zip" "$GHIDRA_RELEASE_URL"
          printf '%s  %s\n' "$GHIDRA_RELEASE_SHA256" "$RUNNER_TEMP/ghidra.zip" | sha256sum --check -
          echo "$GHIDRA_RELEASE_SHA256" > verification-results/ghidra-release-sha256.txt
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/rea-ghidra-dist"
          ghidra_dir=""
          for candidate in "$RUNNER_TEMP"/rea-ghidra-dist/*; do
            if [[ -f "$candidate/Ghidra/application.properties" ]]; then
              ghidra_dir="$candidate"
              break
            fi
          done
          if [[ -z "$ghidra_dir" ]]; then
            echo "::error::Verified vendor archive does not contain Ghidra application.properties"
            exit 1
          fi
          echo "GHIDRA_INSTALL_DIR=$ghidra_dir" >> "$GITHUB_ENV"
          grep -E '^application\.(version|java\.min|java\.max)=' "$ghidra_dir/Ghidra/application.properties" \
            | tee verification-results/ghidra-application.properties.txt

      - name: Verify real native Ghidra analysis and decompilation
        run: |
          set -euo pipefail
          node scripts/verify-real-ghidra.mjs | tee verification-results/ghidra-native-e2e.json

      - name: Sign evidence with SHA-256 digest list
        if: always()
        run: |
          cd verification-results
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Retain Ghidra E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-ghidra-native-e2e-evidence
          path: verification-results/
          if-no-files-found: warn
          retention-days: 30
