name: Audit all 207 production MCP tools
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rea-mcp-207-audit.yml"
      - "scripts/ci/rea-207-mcp-catalog-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-catalog-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CI: "true"
      HUSKY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NO_COLOR: "1"
      REA_EXPECTED_MCP_COUNT: "207"
    steps:
      - name: Checkout revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile production runtime
        run: npm run build:cached
      - name: Audit all production MCP tools, schemas and safe invocation paths
        run: node scripts/ci/rea-207-mcp-catalog-audit.mjs verification-results/mcp-207-catalog.json
      - name: Full MCP boundary regression
        if: matrix.os == 'ubuntu-24.04'
        run: npm run test:mcp
      - name: Hash JSON evidence
        if: always()
        run: node -e "const fs=require('node:fs');const c=require('node:crypto');const p='verification-results/mcp-207-catalog.json';if(fs.existsSync(p))fs.writeFileSync('verification-results/SHA256SUMS.txt',c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  mcp-207-catalog.json\\n')"
      - name: Preserve individual tool ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-207-mcp-${{ matrix.os }}
          path: verification-results/
          if-no-files-found: warn
          retention-days: 30
